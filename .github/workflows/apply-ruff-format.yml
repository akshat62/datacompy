name: Apply Ruff Formatting

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/boolean-comparator-parity
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install formatting dependencies
        run: pip install -e '.[dev]'

      - name: Apply Ruff fixes and formatting
        run: |
          ruff check --fix .
          ruff format .

      - name: Commit formatter output
        run: |
          rm .github/workflows/apply-ruff-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Ruff formatting"
          git push origin HEAD:feat/boolean-comparator-parity
